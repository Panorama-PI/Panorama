<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panorama | Dashboards</title>


    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/filtros-pesquisa.css">


    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!--FONT AWESOME-->
    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>
</head>

<!-- <body onload=" atualizarFeed()"> -->

<body style="background-color: black;">

    <aside class="aside-left">
        <div class="usuario-side">
            <img src="../../assets/imgs/matheus.jpg">

            <h2 id="a_usuario">Usuário</h3>
                <h3 id="b_produtor">Produtor</h3>
                <h4 id="c_email">email@gmail.com</h3>
        </div>

        <div class="btns-side">
            <a href="../../index.html"><img src="../../assets/icon/sair-icon.png" alt="">Home</a>
            <a href="./dashboard-geral.html"><img src="../../assets/icon/chart-icon.png" alt="">Visão Geral</a>
            <a href="./dashboard-especifica.html"><img src="../../assets/icon/chart-icon.png" alt="">Visão
                Específica</a>
            <a href="" class="active"><img src="../../assets/icon/pesquisa-icon.png" alt=""
                    id="limpar_pesquisa">Pesquisa</a>
            <a href="./publicacao.html"><img src="../../assets/icon/publicacao.png" alt="">Publicações</a>
            <a href="./feedbacks.html"><img src="../../assets/icon/mail-icon.png" alt="">Feedbacks</a>
        </div>

    </aside>

    <main class="home-pesquisa">
        <section class="filter">
            <h2>Pesquisar</h2>
        </section>

        <section class="pesquisa-cards">
            <input id="pesquisa_bar" class="card pesquisa-card" type="text" placeholder="Digite o nome do filme">
            <button type="button" id="filtro-bar" class="card pesquisa-card" onclick="abrirFiltros()">
                Filtros Avançados
            </button>

            <button id="buscar-bar" class=" card pesquisa-card" onclick="buscar()">
                Buscar
            </button>


        </section>

        <section id="painel-filtros" class="painel-filtros" style="display: none;">
            <h3>Filtros avançados</h3>

            <label for="filtro-genero">Gênero</label>
            <select id="filtro-genero">
                <option value="">Todos</option>
                <option value="Drama">Drama</option>
                <option value="Action">Ação</option>
                <option value="Science Fiction">Ficção científica</option>
                <option value="Adventure">Aventura</option>
                <option value="Animation">Animação</option>
                <option value="Family">Família</option>
                <option value="Fantasy">Fantasia</option>
                <option value="Comedy">Comédia</option>
                <option value="Thriller">Suspense</option>
                <option value="Crime">Crime</option>
                <option value="Horror">Terror</option>
                <option value="Mystery">Mistério</option>
                <option value="History">História</option>
                <option value="War">Guerra</option>
                <option value="Documentary">Documentário</option>
                <option value="Romance">Romance</option>
                <option value="Music">Música</option>
                <option value="Western">Faroeste</option>
                <option value="TV Movie">Filme para TV</option>
            </select>

            <label for="filtro-pais">País</label>
            <input id="filtro-pais" type="text" placeholder="Digite a sigla do País desejado Ex.: US">

            <div id="filtro-lucro-container">
                <label for="filtro-operador-lucro">Lucro</label>
                <select id="filtro-operador-lucro">
                    <option value="">Não filtrar por lucro</option>
                    <option value="maior">Maior ou igual a</option>
                    <option value="menor">Menor ou igual a</option>
                </select>

                <input id="filtro-valor-lucro" type="number" placeholder="Valor do lucro">
            </div>

            <div id="filtro-avaliacao-container" style="display: none;">
                <label for="filtro-operador-avaliacao">Avaliação</label>
                <select id="filtro-operador-avaliacao">
                    <option value="">Não filtrar por avaliação</option>
                    <option value="maior">Maior ou igual a</option>
                    <option value="menor">Menor ou igual a</option>
                </select>

                <input id="filtro-valor-avaliacao" type="number" placeholder="Valor da avaliação">
            </div>

            <label for="filtro-titulo">Nome para salvar o filtro</label>
            <input id="filtro-titulo" type="text" placeholder="Ex.: Filmes de ação lucrativos">

            <div class="acoes-filtros">
                <button type="button" onclick="aplicarFiltros()">Aplicar filtros</button>
                <button type="button" onclick="salvarFiltro()">Salvar filtro</button>
                <button type="button" onclick="listarFiltros()">Meus filtros salvos</button>
                <button type="button" onclick="fecharFiltros()">Fechar</button>
            </div>

            <div id="lista-filtros-salvos"></div>

        </section>
        <section id="tabela_filmes" class="table-pesquisa">
            <h1 id="titulo"></h1>
            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Ator Principal</th>
                            <th>Gênero</th>
                            <th>País</th>
                            <th>Lucro</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>

            </div>
        </section>
    </main>



</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panorama | Visão Específica</title>

    <link rel="stylesheet" href="./../../css/dashboard.css">
    <script src="../../js/sessao.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../../js/dashboard.js"></script>

    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>
</head>

<body>

    <aside class="aside-left">

        <div class="usuario-side">
            <img src="../../assets/imgs/foto-usuario.png" alt="Foto do usuário">
            <h2 id="a_usuario">Usuário</h2>
            <h3 id="b_produtor">Produtor</h3>
            <h4 id="c_email">email@gmail.com</h4>
        </div>

        <div class="btns-side">
            <a href="./dashboard-geral.html"><img src="../../assets/icon/chart-icon.png" alt="">Visão Geral</a>
            <a href="./dashboard-especifica.html" class="active"><img src="../../assets/icon/chart-icon.png" alt="">Visão Específica</a>
            <a href="./pesquisa.html"><img src="../../assets/icon/pesquisa-icon.png" alt="">Pesquisa</a>
            <a href="./publicacao.html"><img src="../../assets/icon/publicacao.png" alt="">Publicações</a>
            <a href="./feedbacks.html"><img src="../../assets/icon/mail-icon.png" alt="">Feedbacks</a>
            <a href="../../index.html"><img src="../../assets/icon/sair-icon.png" alt="">Sair</a>
        </div>

    </aside>

    <main class="dash">

        <section class="filter">

            <h2>Dashboard Produtor - Visão Específica &nbsp;(1903-2023)</h2>

            <label for="select_genero">
                Gênero selecionado:

                <select id="select_genero"></select>
            </label>

        </section>

        <section class="kpi-cards">

            <div class="card kpi-card">
                <p>País Mais Lucrativo</p>
                <h2 id="kpi-pais-titulo">Carregando...</h2>
                <span id="kpi-pais-detalhe">&nbsp;</span>
            </div>

            <div class="card kpi-card">
                <p>Ator com Mais Aparições em Filmes Lucrativos</p>
                <h2 id="kpi-ator-titulo">Carregando...</h2>
                <span id="kpi-ator-detalhe">&nbsp;</span><br>
                <span id="kpi-ator-detalhe2"></span>
            </div>

            <div class="card kpi-card">
                <p>Período de Pico de Lucro</p>
                <h2 id="kpi-periodo-titulo">Carregando...</h2>
                <span id="kpi-periodo-detalhe">&nbsp;</span>
            </div>

        </section>

        <section class="charts">

            <div class="card chart-card">
                <canvas id="chartPaisLucro"></canvas>
            </div>

            <div class="card chart-card">
                <canvas id="chartAtoresAparicoes"></canvas>
            </div>

        </section>

        <section class="charts">

            <div class="card chart-card">
                <canvas id="chartPeriodoLucro"></canvas>
            </div>

            <div class="card chart-card">
                <canvas id="chartAtoresLucro"></canvas>
            </div>

        </section>

    </main>

</body>

</html>

<script>

    preencherUsuario();

    const selectGenero = document.getElementById('select_genero');

    function preencherSelectGeneros() {
        selectGenero.innerHTML = '';

        Object.keys(GENEROS_PT).forEach(function (generoIngles) {
            const option = document.createElement('option');
            option.value = generoIngles;
            option.textContent = GENEROS_PT[generoIngles];
            selectGenero.appendChild(option);
        });
    }

    preencherSelectGeneros();

    // Texto exibido no select (português); o value é o nome do gênero no banco (inglês)
    function nomeGeneroSelecionado() {
        return selectGenero.options[selectGenero.selectedIndex].text;
    }

    // Os dados vêm da API: GET /dashboards/produtor/especifica?genero=<nome no banco>
    // (views vw_prod_esp_*). Todos os gráficos e KPIs são filtrados pelo gênero do select.
    // Os gráficos são criados vazios abaixo e preenchidos em carregarGenero().


    // País de origem x Lucro (Em quais países o gênero escolhido mais lucra - Top 5)
    // SQL: SELECT paisOrigem, SUM(receita - orcamento) / 1000000000 AS lucro_bilhoes
    //      FROM filme
    //      WHERE genero LIKE '%Ação%' AND orcamento > 0
    //      GROUP BY paisOrigem ORDER BY lucro_bilhoes DESC LIMIT 5;
    // Obs.: o gráfico mostra do menor para o maior (de cima para baixo), então inverta a lista
    // ao montar os dados. Se paisOrigem vier como sigla (ex.: US), traduzir para o nome no JS.


    // Plugin de linha de média
    const pluginMedia = {

        id: 'pluginMedia',

        afterDraw(chart, args, opcoes) {

            const valores = chart.data.datasets[0].data;

            if (!valores || valores.length === 0) return;

            let soma = 0;
            let quantidade = 0;

            for (let i = 0; i < valores.length; i++) {

                if (typeof valores[i] === 'number') {
                    soma += valores[i];
                    quantidade++;
                }

            }

            if (quantidade === 0) return;

            // Usa a média vinda da view do banco; se não vier, calcula a dos valores plotados
            let media = soma / quantidade;
            if (opcoes && typeof opcoes.valor === 'number') {
                media = opcoes.valor;
            }

            const ctx = chart.ctx;
            const area = chart.chartArea;

            // Identifica a orientação do gráfico
            const horizontal = chart.config.type === 'bar' &&
                chart.options.indexAxis === 'y';

            // Identifica a posição da média no eixo
            const posicao = horizontal
                ? chart.scales.x.getPixelForValue(media)
                : chart.scales.y.getPixelForValue(media);

            // Formatação do valor da média
            const texto = `Média: ${media.toFixed(1).replace('.', ',')}B`;

            ctx.save();

            // Linha verde pontilhada
            ctx.beginPath();
            ctx.setLineDash([6, 5]);
            ctx.strokeStyle = '#00C853';
            ctx.lineWidth = 2;

            if (horizontal) {

                ctx.moveTo(posicao, area.top);
                ctx.lineTo(posicao, area.bottom);

            } else {

                ctx.moveTo(area.left, posicao);
                ctx.lineTo(area.right, posicao);

            }

            ctx.stroke();

            // Texto da média
            ctx.setLineDash([]);
            ctx.fillStyle = '#00C853';
            ctx.font = 'bold 11px Arial';

            if (horizontal) {

                ctx.textAlign = 'left';
                ctx.fillText(texto, posicao + 5, area.top + 12);

            } else {

                ctx.textAlign = 'left';
                ctx.fillText(texto, area.left + 5, posicao - 6);

            }

            ctx.restore();

        }

    };


    let chartPaisLucro = new Chart(document.getElementById('chartPaisLucro'), {

        type: 'bar',

        // Plugin aplicado somente neste gráfico
        plugins: [pluginMedia],

        data: {

            labels: [],
            datasets: [{
                data: [],

                backgroundColor: COR_ROSA_BARRA,

                borderRadius: { topRight: 12, bottomRight: 12 },

                borderSkipped: false,

                barThickness: 20

            }]

        },

        options: {

            indexAxis: 'y',

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: { display: false },

                title: tituloGrafico('Lucro Total Acumulado por País', true),

                subtitle: subtituloGrafico(nomeGeneroSelecionado()),

                datalabels: { display: false }

            },

            scales: {

                x: {

                    grid: { color: COR_LINHA_GRID },

                    ticks: {

                        color: '#dfdfdf',
                        callback: (val) => `$ ${val}B`,

                        font: {size: 18}

                    }

                },

                y: {

                    grid: { display: false },

                    ticks: { color: '#dfdfdf', font: {size: 18} }

                }

            }

        }

    });



    // Atores x Aparições em Produções mais lucrativas
    // Quais atores mais aparecem em filmes que deram lucro no gênero - Top 5
    // A coluna atores é um texto único com os nomes separados por vírgula, então é preciso
    // separar os nomes antes de contar (precisa de MySQL 8 ou superior por causa do JSON_TABLE).
    // SQL: SELECT TRIM(a.ator) AS ator, COUNT(*) AS aparicoes
    //      FROM filme f,
    //           JSON_TABLE(CONCAT('["', REPLACE(f.atores, ',', '","'), '"]'),
    //                      '$[*]' COLUMNS (ator VARCHAR(100) PATH '$')) AS a
    //      WHERE f.genero LIKE '%Ação%' AND f.receita > f.orcamento
    //      GROUP BY TRIM(a.ator) ORDER BY aparicoes DESC LIMIT 5;
    // Obs.: a mesma consulta (sem o LIMIT 5, com LIMIT 1) alimenta a KPI "Ator com Mais Aparições".

    const formatarAparicoes = (valor) => `${valor.toFixed().replace('.', ',')}`;

    let chartAtoresAparicoes = new Chart(document.getElementById('chartAtoresAparicoes'), {

        type: 'bar',

        plugins: [pluginRotuloFimBarra(formatarAparicoes)],

        data: {

            labels: [],
            datasets: [{
                data: [],

                backgroundColor: COR_ROSA_BARRA,

                borderRadius: 12,

                borderSkipped: false,

                barThickness: 16

            }]

        },

        options: {

            indexAxis: 'y',

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: { display: false },

                title: tituloGrafico('Top 5 Atores com Maior Frequência em Filmes Lucrativos', true),

                subtitle: subtituloGrafico(nomeGeneroSelecionado()),

                datalabels: {

                    anchor: 'end',

                    align: 'right',

                    color: '#FF6B6B',

                    font: { weight: 'bold' },

                    formatter: (val, ctx) => ctx.dataIndex === 0 ? val : ''

                }

            },

            scales: {

                x: {

                    display: true,

                    ticks: { color: '#dfdfdf', font: {size: 18}, precision: 0 }

                },

                y: {

                    grid: { display: false },

                    ticks: { color: '#dfdfdf', font: {size: 18} }

                }

            }

        }

    });



    // Período x Lucro x Gênero
    // Em quais meses do ano o gênero escolhido lucra mais, na média de todos os anos.
    // SQL: SELECT MONTH(dtLancamento) AS mes, AVG(receita - orcamento) AS lucro_medio
    //      FROM filme
    //      WHERE genero LIKE '%Ação%' AND orcamento > 0
    //      GROUP BY MONTH(dtLancamento) ORDER BY mes;
    // Obs.: meses sem nenhum filme não aparecem no resultado.

    let chartPeriodoLucro = new Chart(document.getElementById('chartPeriodoLucro'), {

        type: 'line',

        data: {

            labels: ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'],

            datasets: [{

                data: [],

                borderColor: COR_ROSA_BARRA,

                backgroundColor: COR_ROSA_BARRA,

                pointRadius: 4,

                pointHoverRadius: 6,

                pointBackgroundColor: '#FFFFFF',

                borderWidth: 2,

                tension: 0

            }]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: { display: false },

                title: tituloGrafico('Janelas Mais Lucrativas de Lançamento do Gênero', true),

                subtitle: subtituloGrafico(nomeGeneroSelecionado()),

                datalabels: { display: false }

            },

            scales: {

                y: {

                    min: 0,

                    grid: { color: COR_LINHA_GRID },

                    ticks: {

                        callback: (val) => "$ " + val + "M",

                        color: '#dfdfdf', font: {size: 18}

                    }

                },

                x: {

                    grid: { display: false },

                    ticks: { color: '#dfdfdf', font: {size: 18} }

                }

            }

        }

    });



    // Atores x Gênero x Lucro
    // Quais atores mais geraram lucro no gênero escolhido, em milhões - Top 5.
    // Usa a mesma separação de nomes do gráfico de aparições.
    // SQL: SELECT TRIM(a.ator) AS ator, SUM(f.receita - f.orcamento) / 1000000 AS lucro_milhoes
    //      FROM filme f,
    //           JSON_TABLE(CONCAT('["', REPLACE(f.atores, ',', '","'), '"]'),
    //                      '$[*]' COLUMNS (ator VARCHAR(100) PATH '$')) AS a
    //      WHERE f.genero LIKE '%Ação%' AND f.orcamento > 0
    //      GROUP BY TRIM(a.ator) ORDER BY lucro_milhoes DESC LIMIT 5;

    let chartAtoresLucro = new Chart(document.getElementById('chartAtoresLucro'), {

        type: 'bar',

        data: {

            labels: [],
            datasets: [{
                data: [],

                backgroundColor: COR_ROSA_BARRA,

                borderRadius: 0,

                borderSkipped: false,

                barThickness: 45

            }]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: { display: false },

                title: tituloGrafico('Top 5 Atores Mais Rentáveis em Bilheteria', true),

                subtitle: subtituloGrafico(nomeGeneroSelecionado()),

                datalabels: {

                    anchor: 'center',

                    align: 'center',

                    color: '#2B2B2E',

                    font: { weight: 'bold', size: 11 }

                }

            },

            scales: {

                y: {

                    grid: { color: COR_LINHA_GRID },

                    ticks: {

                        callback: (val) => val === 0 ? '0' : `${val}M`,

                        color: '#dfdfdf',

                        font: {size: 18}

                    }

                },

                x: {

                    grid: { display: false },

                    ticks: { color: '#dfdfdf', font: {size: 18} }

                }

            }

        }

    });



    // ===== Integração com o banco =====
    function preencherKpis(kpis) {
        // KPI 1: país mais lucrativo
        var pais = kpis.paisMaisLucrativo;

        if (pais === null) {
            setTexto('kpi-pais-titulo', 'Sem dados');
            setTexto('kpi-pais-detalhe', '');
        } else {
            setTexto('kpi-pais-titulo', (pais.pais));

            if (pais.pct_do_genero !== null) {
                setTexto('kpi-pais-detalhe', 'Representa ' + pais.pct_do_genero + '% do lucro total do gênero');
            } else {
                setTexto('kpi-pais-detalhe', 'Lucro total de ' + formatarDinheiro(pais.lucro_total));
            }
        }

        // KPI 2: ator com mais aparições (o detalhe tem duas linhas)
        var ator = kpis.atorMaisAparicoes;

        if (ator === null) {
            setTexto('kpi-ator-titulo', 'Sem dados');
            setTexto('kpi-ator-detalhe', '');
            setTexto('kpi-ator-detalhe2', '');
        } else {
            setTexto('kpi-ator-titulo', ator.ator);
            setTexto('kpi-ator-detalhe', ator.aparicoes + ' aparições');

            if (ator.segundo_ator !== null) {
                setTexto('kpi-ator-detalhe2', comSinal(ator.diferenca) + ' aparições que o 2º colocado ' + ator.segundo_ator);
            } else {
                setTexto('kpi-ator-detalhe2', '');
            }
        }

        // KPI 3: período de pico de lucro
        var pico = kpis.periodoPico;

        if (pico === null) {
            setTexto('kpi-periodo-titulo', 'Sem dados');
            setTexto('kpi-periodo-detalhe', '');
        } else {
            setTexto('kpi-periodo-titulo', pico.periodo);

            if (pico.vantagem_pct !== null) {
                setTexto('kpi-periodo-detalhe', comSinal(pico.vantagem_pct) + '% acima da média anual do gênero');
            } else {
                setTexto('kpi-periodo-detalhe', 'Lucro médio de ' + formatarDinheiro(pico.lucro_medio_periodo));
            }
        }
    }

    // Os valores chegam em dólar: país em bilhões, atores e período em milhões.
    function preencherGraficos(g) {
        atualizarGrafico(chartPaisLucro,
            pegarPaises(g.paisLucro),
            pegarNumeros(g.paisLucro, 'lucro_total', BILHAO),
            pegarMedia(g.paisLucro, 'media_top5', BILHAO));

        atualizarGrafico(chartAtoresAparicoes,
            pegarTextos(g.atoresAparicoes, 'ator'),
            pegarNumeros(g.atoresAparicoes, 'aparicoes', 1),
            null);

        atualizarGrafico(chartPeriodoLucro,
            ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'],
            pegarMeses(g.periodoLucro, 'lucro_medio', MILHAO),
            pegarMedia(g.periodoLucro, 'media_anual', MILHAO));

        atualizarGrafico(chartAtoresLucro,
            pegarTextos(g.atoresLucro, 'ator'),
            pegarNumeros(g.atoresLucro, 'lucro_total', MILHAO),
            null);
    }

    function carregarGenero() {
        var genero = selectGenero.value;

        // Atualiza o subtítulo verde de cada gráfico
        chartPaisLucro.options.plugins.subtitle.text = nomeGeneroSelecionado();
        chartAtoresAparicoes.options.plugins.subtitle.text = nomeGeneroSelecionado();
        chartPeriodoLucro.options.plugins.subtitle.text = nomeGeneroSelecionado();
        chartAtoresLucro.options.plugins.subtitle.text = nomeGeneroSelecionado();

        // Trava o select enquanto carrega, para não misturar respostas de gêneros diferentes
        selectGenero.disabled = true;

        buscarDados('/dashboards/produtor/especifica?genero=' + encodeURIComponent(genero))
            .then(function (dados) {
                preencherKpis(dados.kpis);
                preencherGraficos(dados.graficos);
                selectGenero.disabled = false;
            })
            .catch(function (erro) {
                console.error('Erro ao carregar a dashboard específica do produtor:', erro);
                setTexto('kpi-pais-titulo', 'Erro ao carregar');
                setTexto('kpi-ator-titulo', 'Erro ao carregar');
                setTexto('kpi-periodo-titulo', 'Erro ao carregar');
                selectGenero.disabled = false;
            });
    }

    selectGenero.addEventListener('change', carregarGenero);
    carregarGenero();
</script>

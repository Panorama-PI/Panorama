<body style="background-color: black;">

                <h3 id="b_produtor">Produtor</h3>

            <a href="./feedbacks.html"><img src="../../assets/icon/mail-icon.png" alt="">Feedbacks</a>
        </div>

        </aside>

        <main class="publicacao">
    <div class="cabecalho-publicacoes">
        <h1>Publicações da empresa</h1>
        <p>Use filtros para localizar projetos com potencial de investimento.</p>
    </div>

    <!-- Barra de Filtros -->
    <div class="filtros-container">
        <div class="filtro-item">
            <label for="roteirista">ROTEIRISTA</label>
            <select id="roteirista">
                <option value="">Todos</option>
            </select>
        </div>

        <div class="filtro-item">
            <label for="ordenar">ORDENAR</label>
            <select id="ordenar">
                <option value="recentes">Mais recentes</option>
                <option value="antigos">Mais antigas</option>
                <option value="nome-asc">Nome (A - Z)</option>
                <option value="nome-desc">Nome (Z - A)</option>
            </select>
        </div>

        <button type="button" class="btn-filtrar" onclick="aplicarFiltros()">Aplicar filtros</button>
    </div>

    <div class="cards-publicacoes">
  
    </div>

</main>

    <!-- Modal: Detalhes e Anotações da Publicação -->
    <div id="modal-publicacao" class="modal-overlay" style="display: none;" onclick="fecharModalExterno(event)">
        <div class="modal-conteudo modal-anotacoes-projeto" onclick="event.stopPropagation()">
            <div class="modal-header-limpo">
                <div>
                    <h2 id="modal-titulo" class="modal-titulo-projeto">Título do Projeto</h2>
                    <span class="modal-subtitulo-projeto">Publicação e Anotações</span>
                </div>
                <button type="button" class="btn-fechar-modal" onclick="fecharModal()" aria-label="Fechar janela">&times;</button>
            </div>

            <div class="modal-corpo-limpo">
                <!-- Descrição da publicação -->
                <div class="modal-bloco">
                    <h3 class="modal-bloco-titulo">Descrição da publicação</h3>
                    <p id="modal-descricao" class="modal-descricao-texto"></p>
                    <p id="modal-premissa" style="display: none;"></p>
                    <div id="modal-tags" style="display: none;"></div>
                </div>

                <!-- Anotações vinculadas ao projeto -->
                <div class="modal-bloco">
                    <div class="modal-bloco-topo">
                        <h3 class="modal-bloco-titulo">Anotações vinculadas</h3>
                        <span id="modal-total-anotacoes" class="modal-contador-anotacoes">0 anotações</span>
                    </div>

                    <div id="modal-lista-anotacoes" class="modal-lista-anotacoes">
                        <!-- Preenchido dinamicamente com as anotações do projeto -->
                    </div>
                </div>
            </div>

            <div class="modal-rodape-limpo">
                <button type="button" class="btn-fechar-secundario" onclick="fecharModal()">Fechar</button>
            </div>
        </div>
    </div>

<script src="../../js/publicacao.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Cadastro</title>

  <link rel="stylesheet" href="./css/cadastro.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=IBM+Plex+Serif:wght@400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>

  <main class="card">

    <header class="card-titulo">
      <h1>Cadastrar</h1>
      <p>Crie sua conta para acessar a plataforma.</p>
    </header>

    <div class="card-formulario">

      <div class="campo campo-total">
        <label for="ipt_token">Token de acesso</label>
        <input type="text" id="ipt_token" placeholder="Cole aqui o token que você recebeu" autocomplete="off" spellcheck="false">
        <span class="dica">O token já vincula você à sua empresa.</span>
      </div>

      <div class="campo campo-total">
        <label for="selectCargo">Cargo</label>
        <select id="selectCargo">
          <option value="">Selecione seu cargo</option>
          <option value="Produtor">Produtor</option>
          <option value="Roteirista">Roteirista</option>
        </select>
      </div>

      <div class="campo campo-total">
        <label for="ipt_nome">Nome</label>
        <input type="text" id="ipt_nome" placeholder="Seu nome completo" autocomplete="name">
      </div>

      <div class="campo campo-total">
        <label for="ipt_email">E-mail</label>
        <input type="email" id="ipt_email" placeholder="voce@exemplo.com" autocomplete="email">
      </div>

      <div class="campo">
        <label for="ipt_senha">Senha</label>
        <input type="password" id="ipt_senha" placeholder="8 a 12 caracteres" autocomplete="new-password">
      </div>

      <div class="campo">
        <label for="ipt_confirmacao_senha">Confirmação de senha</label>
        <input type="password" id="ipt_confirmacao_senha" placeholder="Repita a senha" autocomplete="new-password">
      </div>

      <p class="dica campo-total">
        A senha deve ter de 8 a 12 caracteres, com letras maiúsculas e minúsculas, números e um caractere especial (@ ! # $ % & * _ -).
      </p>

      <label class="mostrar-senha">
        <input type="checkbox" id="chk_mostrar" onchange="alternarSenha()">
        Mostrar senhas
      </label>

      <div class="erros" id="caixa_erros" role="alert" aria-live="assertive"></div>
      <div class="sucesso" id="caixa_sucesso" role="status" aria-live="polite"></div>
    </div>

    <div class="card-mensagem-login">
      <p>
        Já possui uma conta?
        <a href="./login.html">Vá para a página de login!</a>
      </p>
    </div>

    <div class="card-botao-cadastro">
      <a class="botao voltar" href="./index.html">Voltar</a>
      <button type="button" class="botao cadastrar" id="btn_cadastrar" onclick="cadastrar()">Cadastrar</button>
    </div>

  </main>

  <script>

    // Mostra ou esconde o texto das senhas.
    function alternarSenha() {
      const tipo = chk_mostrar.checked ? "text" : "password";
      ipt_senha.type = tipo;
      ipt_confirmacao_senha.type = tipo;
    }

    // Exibe a lista de erros na própria tela (substitui os alert()).
    function mostrarErros(erros) {
      if (erros.length == 0) {
        caixa_erros.classList.remove("visivel");
        caixa_erros.innerHTML = "";
        return;
      }
      caixa_erros.innerHTML =
        "<strong>Cadastro não realizado. Corrija os itens abaixo:</strong><ul>" +
        erros.map((e) => `<li>${e}</li>`).join("") +
        "</ul>";
      caixa_erros.classList.add("visivel");
      caixa_erros.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    // Exibe a mensagem de sucesso na própria tela.
    function mostrarSucesso(mensagem) {
      mostrarErros([]);
      caixa_sucesso.innerHTML = `<strong>${mensagem}</strong>Redirecionando para o login...`;
      caixa_sucesso.classList.add("visivel");
      caixa_sucesso.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    // Valida os dados informados pelo usuário e realiza o cadastro
    // caso todas as informações estejam corretas.
    function cadastrar() {

      const numeros = "0123456789";
      const charEspeciais = "@!#$%&*_-";

      const token = ipt_token.value.trim();
      const nome = ipt_nome.value.trim();
      const email = ipt_email.value.trim();
      const senha = ipt_senha.value;
      const confirmacaoSenha = ipt_confirmacao_senha.value;

      const contem = (texto, conjunto) => [...texto].some((c) => conjunto.includes(c));
      const erros = [];

      // Campos obrigatórios.
      if (!token || !selectCargo.value || !nome || !email || !senha || !confirmacaoSenha) {
        erros.push("Preencha todos os campos, incluindo token e cargo.");
      }

      // Nome sem números ou caracteres especiais.
      if (contem(nome, numeros)) erros.push("O nome não pode incluir números.");
      if (contem(nome, charEspeciais)) erros.push("O nome não pode incluir caracteres especiais.");

      // Formato mínimo do e-mail.
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        erros.push("Informe um e-mail válido.");
      }

      // Regras da senha.
      if (senha) {
        if (senha.length < 8) erros.push("A senha precisa ter no mínimo 8 caracteres.");
        if (senha.length > 12) erros.push("A senha precisa ter no máximo 12 caracteres.");
        if (!contem(senha, numeros)) erros.push("A senha precisa incluir números.");
        if (!contem(senha, charEspeciais)) erros.push("A senha precisa incluir caracteres especiais.");
        if (senha.toLowerCase() === senha) erros.push("A senha precisa incluir letras maiúsculas.");
        if (senha.toUpperCase() === senha) erros.push("A senha precisa incluir letras minúsculas.");
      }

      // Confirmação de senha.
      if (senha != confirmacaoSenha) erros.push("As senhas não conferem.");

      caixa_sucesso.classList.remove("visivel");
      mostrarErros(erros);
      if (erros.length > 0) return;

      btn_cadastrar.disabled = true;
      btn_cadastrar.textContent = "Cadastrando...";

      // Envia os dados do cadastro para o backend.
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          tokenServer: token,
          nomeServer: nome,
          emailServer: email,
          senhaServer: senha,
          cargoServer: selectCargo.value
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);

          if (resposta.ok) {
            btn_cadastrar.textContent = "Cadastro realizado!";
            mostrarSucesso("Cadastro realizado com sucesso!");

            // Após o cadastro, redireciona o usuário para a tela de login.
            setTimeout(() => {
              window.location = "login.html";
            }, 2000);

          } else {
            // Mostra a mensagem que o backend enviou (token inválido, formato, etc.).
            resposta.text().then(function (mensagem) {
              mostrarErros([mensagem || "Não foi possível concluir o cadastro. Confira o token e os dados informados."]);
            });
            btn_cadastrar.disabled = false;
            btn_cadastrar.textContent = "Cadastrar";
          }
        })
        .catch(function (erro) {
          console.log(`#ERRO: ${erro}`);
          mostrarErros(["Erro de conexão com o servidor. Tente novamente."]);
          btn_cadastrar.disabled = false;
          btn_cadastrar.textContent = "Cadastrar";
        });
    }

  </script>
</body>

</html>
